          <section class="signal-lab" aria-label="Fourier series plots">
            <div class="signal-head">
              <div class="signal-control">
                <label for="harmonic-count">k harmonics</label>
                <div class="signal-slider-wrap">
                  <output id="harmonic-value" for="harmonic-count">9</output>
                  <input
                    id="harmonic-count"
                    type="range"
                    min="1"
                    max="10"
                    value="5"
                    step="1"
                  />
                </div>
              </div>
            </div>

            <div class="signal-grid">
              <figure class="signal-panel">
                <figcaption>x(t)</figcaption>
                <pre
                  id="time-domain-plot"
                  class="signal-plot"
                  aria-label="Time-domain plot of a partial Fourier-series square-wave approximation"
                ></pre>
              </figure>

              <figure class="signal-panel">
                <figcaption>|x(f)|</figcaption>
                <pre
                  id="frequency-domain-plot"
                  class="signal-plot"
                  aria-label="Frequency-domain stem plot of odd harmonic amplitudes"
                ></pre>
              </figure>
            </div>
          </section>
        </div>
      </section>
